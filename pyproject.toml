[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-mcp"
version = "0.1.0"
description = "MCP connector exposing Home Assistant to AI agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "requests>=2.31.0",
]

[project.scripts]
ha-mcp = "ha_mcp.server:main"

[tool.setuptools]
packages = ["ha_mcp"]
